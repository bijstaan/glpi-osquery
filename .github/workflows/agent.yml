# Build the osquery agent and its installers.
#
# Three runners, because the artifacts genuinely need three operating systems:
#
#   ubuntu-latest   everything that can be produced on Linux — the Go binaries
#                   for all six targets, the bundles, the .deb and, via wixl,
#                   the Windows .msi. Cross-compiling is the point: one host
#                   produces the whole release so every artifact in it came
#                   out of the same checkout.
#   macos-latest    the .pkg. pkgbuild and productbuild are Xcode tools with
#                   no Linux equivalent, and build-pkg.sh refuses to run
#                   anywhere else. It also lipos the two darwin bundles into a
#                   universal binary, which needs lipo.
#   windows-latest  nothing is *built* here. This job exercises what the build
#                   cannot check: that msiexec leaves a service registered
#                   against the `current` junction rather than the versioned
#                   path, that it stays stopped when it has no server to talk
#                   to, and that the directory name matches the version the
#                   binary reports.
#
# The macOS and Windows jobs consume the artifacts the Linux job produced
# rather than building their own. An installer that compiled its own copy
# would be testing something other than what the fleet actually runs.

name: agent

on:
  # The path filter applies to the branch pushes only: GitHub skips paths and
  # paths-ignore entirely for tag pushes, so cutting a v-tag on a commit that
  # happened not to touch agent/ still builds a release.
  push:
    branches: [master, main]
    paths:
      - 'agent/**'
      - '.github/workflows/agent.yml'
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the binaries and installers
        default: ''

permissions:
  contents: read

jobs:
  # Worked out once, in a shell, rather than in an expression. Everything
  # downstream compares this string against itself — the versioned directory
  # name, the ldflags stamp, the MSI's full_version — so a `v` prefix surviving
  # in one place and not another turns into a failed assertion three jobs
  # later. Tags are stripped to their bare version here and nowhere else.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            v="$INPUT_VERSION"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            v="${GITHUB_REF#refs/tags/}"
            v="${v#v}"
          else
            v="0.0.0-ci"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "building $v"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      # The same four checks the monorepo's GitLab pipeline runs, in the same
      # order, so a change that is green there is green here.
      - name: gofmt, vet, build, test
        working-directory: agent
        env:
          # Test builds need no VCS stamp, and stamping fails when the
          # checkout's ownership differs from the job user's.
          GOFLAGS: -buildvcs=false
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt"; exit 1; }
          go vet ./...
          go build ./...
          go test ./...

  # Bundles for all six targets, plus the two Linux packages and the two
  # Windows installers. One job rather than a matrix: build.sh caches each
  # osqueryd download under dist/cache, and a matrix would re-fetch several
  # hundred megabytes from osquery's releases for every leg.
  linux:
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Lifted into the environment because `secrets` is not one of the
      # contexts available to a step's `if:` — `env` is.
      SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
      SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # wixl is a separate package from msitools, which ships msiinfo/msibuild
      # but not wixl itself. build-msi.sh needs all three, and osslsigncode
      # only when a certificate is configured.
      - name: Install the packaging tools
        run: sudo apt-get update && sudo apt-get install -y wixl msitools osslsigncode

      # Real bundles with the real osqueryd fetched from upstream, which
      # publishes every platform as a plain archive — so nothing here has to
      # unpack an MSI or a .pkg, and windows/arm64 is genuine rather than a
      # cross-built agent wrapped around a stand-in.
      - name: Build the bundles
        working-directory: agent
        run: ./build.sh "$VERSION" all

      - name: Build the Debian packages
        working-directory: agent
        run: |
          ./packaging/build-deb.sh "$VERSION" amd64
          ./packaging/build-deb.sh "$VERSION" arm64

      # Opt-in. Without a certificate the MSIs come out unsigned, which is fine
      # for CI but SmartScreen warns on them and many fleets refuse unsigned
      # installers outright — so set these two secrets before cutting a tag.
      - name: Prepare the code-signing certificate
        if: env.SIGN_PFX_BASE64 != ''
        run: |
          printf '%s' "$SIGN_PFX_BASE64" | base64 -d > "$RUNNER_TEMP/sign.pfx"
          echo "SIGN_PFX=$RUNNER_TEMP/sign.pfx" >> "$GITHUB_ENV"

      # build-msi.sh asserts the MSI's own contents — secure properties, the
      # versioned directory name, the service account and start type, the
      # custom-action type — and fails rather than shipping a subtly wrong
      # package.
      - name: Build and verify the MSIs
        working-directory: agent
        run: |
          ./packaging/build-msi.sh "$VERSION" amd64
          ./packaging/build-msi.sh "$VERSION" arm64

      - name: Checksums
        working-directory: agent
        run: cat dist/"$VERSION"/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: |
            agent/dist/${{ needs.version.outputs.version }}/*.tar.gz
            agent/dist/${{ needs.version.outputs.version }}/*.tar.gz.sha256
            agent/dist/${{ needs.version.outputs.version }}/*.zip
            agent/dist/${{ needs.version.outputs.version }}/*.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: agent/dist/${{ needs.version.outputs.version }}/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: |
            agent/dist/${{ needs.version.outputs.version }}/*.msi
            agent/dist/${{ needs.version.outputs.version }}/*.msi.sha256

  # The .pkg, and a real install of it.
  macos:
    needs: [version, linux]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      INSTALL_ROOT: /usr/local/glpi-osquery-agent
      LABEL: com.bijstaan.glpi-osquery-agent
    steps:
      - uses: actions/checkout@v4

      # build-pkg.sh takes the tarballs build.sh produced as its input, so what
      # the .pkg installs is byte-identical to what a self-update would fetch.
      - uses: actions/download-artifact@v4
        with:
          name: bundles
          path: agent/dist/${{ needs.version.outputs.version }}

      # Unsigned here. Signing and notarisation need a Developer ID in a Mac
      # keychain; build-pkg.sh picks it up from INSTALLER_IDENTITY,
      # APP_IDENTITY and NOTARY_PROFILE once one is provisioned.
      - name: Build the universal .pkg
        working-directory: agent
        run: ./packaging/build-pkg.sh "$VERSION" universal

      - name: Install
        working-directory: agent
        run: sudo installer -pkg "dist/$VERSION/glpi-osquery-agent_${VERSION}_universal.pkg" -target / -verbose

      - name: Check what was installed
        run: |
          set -euo pipefail
          bin="$INSTALL_ROOT/current/bin/glpi-osquery-agent"
          [ -x "$bin" ] || { echo "current symlink missing or broken"; exit 1; }
          [ -x "$INSTALL_ROOT/versions/$VERSION/bin/osqueryd" ] || { echo "osqueryd missing"; exit 1; }

          # The bug this guards: "universal" takes the arm64 bundle and lipos
          # the Intel supervisor into it. If that step is skipped the .pkg
          # installs cleanly on the arm64 runner and is silently unusable on
          # every Intel Mac in the fleet.
          archs="$(lipo -archs "$bin")"
          echo "supervisor archs: $archs"
          case "$archs" in
            *x86_64*) ;;
            *) echo "not a universal binary"; exit 1 ;;
          esac
          case "$archs" in
            *arm64*) ;;
            *) echo "not a universal binary"; exit 1 ;;
          esac

          # The versioned directory must be named exactly what the binary
          # reports, or the updater will try to 'update' to what is running.
          reported="$("$bin" version)"
          [ "$reported" = "$VERSION" ] || { echo "binary reports '$reported' but the directory is named '$VERSION'"; exit 1; }

          # pkgbuild --ownership recommended, not whatever built the tree.
          # osqueryd refuses to start when its own binary is owned by anyone
          # but the user running it, so a .pkg built by an ordinary user
          # installs an agent that cannot start osqueryd at all.
          owner="$(stat -f '%Su:%Sg' "$INSTALL_ROOT/versions/$VERSION/bin/osqueryd")"
          [ "$owner" = "root:wheel" ] || { echo "osqueryd owned by $owner, expected root:wheel"; exit 1; }

          [ -f "/Library/LaunchDaemons/$LABEL.plist" ] || { echo "launchd plist missing"; exit 1; }

          # Installed without an agent.json on purpose: that is the path that
          # must leave the daemon unloaded rather than restart-looping against
          # a server it has never been told about.
          if sudo launchctl print "system/$LABEL" >/dev/null 2>&1; then
            echo "daemon was bootstrapped without an enrolment"; exit 1
          fi

      - name: Uninstall
        run: |
          sudo launchctl bootout "system/$LABEL" 2>/dev/null || true
          sudo rm -f "/Library/LaunchDaemons/$LABEL.plist"
          sudo rm -rf "$INSTALL_ROOT"
          sudo pkgutil --forget "$LABEL"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: agent/dist/${{ needs.version.outputs.version }}/*.pkg*

  windows:
    needs: [version, linux]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: msi
          path: msi

      - name: Locate the MSI
        run: |
          $msi = (Get-ChildItem -Recurse -Filter *_amd64.msi msi | Select-Object -First 1).FullName
          if (-not $msi) { throw "no amd64 MSI in the artifact" }
          "MSI=$msi" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Installed without SERVER/ENROLLSECRET on purpose: that is the path that
      # must leave a registered, idle service rather than one restart-looping.
      - name: Install
        run: |
          $p = Start-Process msiexec -ArgumentList "/i `"$env:MSI`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 80; throw "msiexec exited $($p.ExitCode)" }

      - name: Check what was installed
        run: |
          $root = "$env:ProgramFiles\GLPI osquery Agent"
          if (-not (Test-Path "$root\versions\$env:VERSION\bin\glpi-osquery-agent.exe")) { throw "versioned binary missing" }
          if (-not (Test-Path "$root\current\bin\glpi-osquery-agent.exe")) { throw "current junction missing or broken" }
          if (-not (Test-Path "$root\current\bin\osqueryd.exe")) { throw "osqueryd missing from the bundle" }

          $svc = Get-CimInstance Win32_Service -Filter "Name='GLPIOsqueryAgent'"
          if (-not $svc) { throw "service not registered" }
          Write-Host "service path: $($svc.PathName)"

          # The bug this guards: ServiceInstall points at the versioned path, so
          # the SCM would keep launching the installed version however many times
          # the agent updated itself.
          if ($svc.PathName -notlike "*\current\bin\glpi-osquery-agent.exe*") {
            throw "service points at '$($svc.PathName)' rather than the current junction; self-update would be inert"
          }
          if ($svc.State -ne "Stopped") { throw "service was started without credentials (state $($svc.State))" }

          # The versioned directory must be named exactly what the binary
          # reports, or the updater will try to 'update' to what is running.
          $reported = (& "$root\current\bin\glpi-osquery-agent.exe" version)
          if ($reported -ne $env:VERSION) { throw "binary reports '$reported' but the MSI was built for '$env:VERSION'" }

      - name: Uninstall
        run: |
          Start-Process msiexec -ArgumentList "/x `"$env:MSI`" /qn" -Wait
          if (Get-Service GLPIOsqueryAgent -ErrorAction SilentlyContinue) { throw "service survived uninstall" }
          if (Test-Path "$env:ProgramFiles\GLPI osquery Agent\current") { throw "junction survived uninstall" }

  # Only on a tag, and only once all three platforms have agreed. Publishing a
  # release in GLPI asks for a URL, a SHA-256 and a size for every package;
  # attaching the .sha256 files alongside the artifacts is what makes the first
  # two real without anyone re-deriving them by hand.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l artifacts
          gh release create "$TAG" artifacts/* \
            --title "$VERSION" \
            --generate-notes
